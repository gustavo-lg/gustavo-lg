<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 18" width="100%" height="18">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00D9FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#7C3AED" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    .center-dot {
      transform-origin: 450px 9px;
      animation: pulseGlow 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Glowing Line -->
  <line x1="50" y1="9" x2="850" y2="9" stroke="url(#dividerGrad)" stroke-width="1.2" />
  
  <!-- Outer Halo -->
  <circle cx="450" cy="9" r="8" fill="url(#centerGlow)" class="center-dot" />

  <!-- Center Diamond Core -->
  <polygon points="450,5 454,9 450,13 446,9" fill="#00D9FF" />
</svg>
