<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 20" width="100%" height="20" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="travel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64D2FF" stop-opacity="0" />
      <stop offset="0.5" stop-color="#64D2FF" stop-opacity="1" />
      <stop offset="1" stop-color="#64D2FF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    @keyframes travel { from { transform: translateX(-140px); } to { transform: translateX(840px); } }
    .travel { animation: travel 6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .travel { animation: none !important; opacity: 0; } }
  </style>
  <rect x="0" y="9.5" width="840" height="1" fill="url(#line)" />
  <rect class="travel" x="0" y="9" width="140" height="2" rx="1" fill="url(#travel)" />
</svg>
