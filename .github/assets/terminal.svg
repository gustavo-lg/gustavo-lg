<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="titleBarBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#131D33" />
    </linearGradient>

    <linearGradient id="barFillCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes lineFadeIn1 {
      0%, 8% { opacity: 0; transform: translateY(4px); }
      12%, 100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes lineFadeIn2 {
      0%, 20% { opacity: 0; transform: translateY(4px); }
      25%, 100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes lineFadeIn3 {
      0%, 35% { opacity: 0; transform: translateY(4px); }
      40%, 100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes lineFadeIn4 {
      0%, 50% { opacity: 0; transform: translateY(4px); }
      55%, 100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes lineFadeIn5 {
      0%, 65% { opacity: 0; transform: translateY(4px); }
      70%, 100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes meterGrow {
      0%, 30% { width: 0px; }
      50%, 100% { width: 140px; }
    }

    .cursor {
      animation: blinkCursor 1s infinite;
    }

    .term-line-1 { animation: lineFadeIn1 8s infinite; }
    .term-line-2 { animation: lineFadeIn2 8s infinite; }
    .term-line-3 { animation: lineFadeIn3 8s infinite; }
    .term-line-4 { animation: lineFadeIn4 8s infinite; }
    .term-line-5 { animation: lineFadeIn5 8s infinite; }
    .meter-bar { animation: meterGrow 8s ease-out infinite; }

    .code-font {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
    }
  </style>

  <!-- Terminal Window Shell -->
  <rect x="2" y="2" width="716" height="336" rx="14" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title Bar -->
  <rect x="2" y="2" width="716" height="38" rx="14" fill="url(#titleBarBg)" />
  <!-- Straighten bottom corners of title bar -->
  <rect x="2" y="26" width="716" height="14" fill="url(#titleBarBg)" />
  <line x1="2" y1="40" x2="718" y2="40" stroke="#1E293B" stroke-width="1" />

  <!-- Window Controls (macOS Dots) -->
  <circle cx="22" cy="20" r="5.5" fill="#EF4444" />
  <circle cx="40" cy="20" r="5.5" fill="#F59E0B" />
  <circle cx="58" cy="20" r="5.5" fill="#10B981" />

  <!-- Window Title -->
  <text x="360" y="24" fill="#64748B" class="code-font" font-size="11.5" font-weight="500" text-anchor="middle">
    gustavo@system-core:~ (zsh)
  </text>

  <!-- Content / Command Session -->
  <g transform="translate(24, 70)">
    <!-- Command Line Prompt -->
    <text x="0" y="0" fill="#38BDF8" class="code-font" font-size="13" font-weight="700">gustavo@cloud</text>
    <text x="110" y="0" fill="#64748B" class="code-font" font-size="13">:</text>
    <text x="120" y="0" fill="#818CF8" class="code-font" font-size="13">~</text>
    <text x="135" y="0" fill="#F8FAFC" class="code-font" font-size="13">$</text>
    <text x="150" y="0" fill="#F1F5F9" class="code-font" font-size="13">npx @gustavo/specs --diagnostics</text>

    <!-- Line 1: Identity & Architecture -->
    <g class="term-line-1" transform="translate(0, 28)">
      <text x="0" y="0" fill="#34D399" class="code-font" font-size="12.5">✔</text>
      <text x="18" y="0" fill="#94A3B8" class="code-font" font-size="12.5">Perfil Ativo:</text>
      <text x="122" y="0" fill="#00D9FF" class="code-font" font-size="12.5" font-weight="600">Fullstack Architect &amp; AI Systems Engineer</text>
    </g>

    <!-- Line 2: Core Stack -->
    <g class="term-line-2" transform="translate(0, 56)">
      <text x="0" y="0" fill="#34D399" class="code-font" font-size="12.5">✔</text>
      <text x="18" y="0" fill="#94A3B8" class="code-font" font-size="12.5">Stack Primária:</text>
      <text x="138" y="0" fill="#F8FAFC" class="code-font" font-size="12.5">Next.js 15, TypeScript, Supabase, Node.js, Tailwind</text>
    </g>

    <!-- Line 3: AI & Automation -->
    <g class="term-line-3" transform="translate(0, 84)">
      <text x="0" y="0" fill="#34D399" class="code-font" font-size="12.5">✔</text>
      <text x="18" y="0" fill="#94A3B8" class="code-font" font-size="12.5">Agentes &amp; IA:</text>
      <text x="130" y="0" fill="#C084FC" class="code-font" font-size="12.5">OpenAI APIs, Claude Pipelines, n8n Multi-Channel Workflows</text>
    </g>

    <!-- Line 4: Payments & Production -->
    <g class="term-line-4" transform="translate(0, 112)">
      <text x="0" y="0" fill="#34D399" class="code-font" font-size="12.5">✔</text>
      <text x="18" y="0" fill="#94A3B8" class="code-font" font-size="12.5">Monetização:</text>
      <text x="125" y="0" fill="#FBBF24" class="code-font" font-size="12.5">Stripe Billing, Webhooks, Assinaturas Recorrentes</text>
    </g>

    <!-- Line 5: Performance Meter & Health -->
    <g class="term-line-5" transform="translate(0, 150)">
      <rect x="0" y="-12" width="670" height="74" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      
      <!-- Metrics Row -->
      <text x="16" y="14" fill="#94A3B8" class="code-font" font-size="11.5">SISTEMA STATUS:</text>
      <text x="130" y="14" fill="#10B981" class="code-font" font-size="11.5" font-weight="700">OPERACIONAL (100%)</text>

      <text x="350" y="14" fill="#94A3B8" class="code-font" font-size="11.5">LATÊNCIA:</text>
      <text x="425" y="14" fill="#00D9FF" class="code-font" font-size="11.5" font-weight="700">~18ms (Edge CDN)</text>

      <!-- Meter Bar Graphic -->
      <text x="16" y="44" fill="#64748B" class="code-font" font-size="11">PERFORMANCE</text>
      <rect x="110" y="34" width="140" height="12" rx="4" fill="#1E293B" />
      <rect x="110" y="34" width="135" height="12" rx="4" fill="url(#barFillCyan)" class="meter-bar" />
      <text x="260" y="44" fill="#00D9FF" class="code-font" font-size="11" font-weight="600">99.8% Core Web Vitals</text>
    </g>

    <!-- New Active Input Line with Blinking Cursor -->
    <g transform="translate(0, 240)">
      <text x="0" y="0" fill="#38BDF8" class="code-font" font-size="13" font-weight="700">gustavo@cloud</text>
      <text x="110" y="0" fill="#64748B" class="code-font" font-size="13">:</text>
      <text x="120" y="0" fill="#818CF8" class="code-font" font-size="13">~</text>
      <text x="135" y="0" fill="#F8FAFC" class="code-font" font-size="13">$</text>
      <text x="150" y="0" fill="#E2E8F0" class="code-font" font-size="13">git commit -m "feat: shipping future-proof software"</text>
      <rect x="585" y="-12" width="8" height="15" fill="#00D9FF" class="cursor" />
    </g>
  </g>
</svg>
