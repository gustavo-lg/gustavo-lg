<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="titleBarBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#131D33" />
    </linearGradient>

    <linearGradient id="barFillCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes fadeInLine1 {
      0%, 6%   { opacity: 0; }
      10%, 93% { opacity: 1; }
      98%, 100%{ opacity: 0; }
    }

    @keyframes fadeInLine2 {
      0%, 16%  { opacity: 0; }
      20%, 93% { opacity: 1; }
      98%, 100%{ opacity: 0; }
    }

    @keyframes fadeInLine3 {
      0%, 28%  { opacity: 0; }
      32%, 93% { opacity: 1; }
      98%, 100%{ opacity: 0; }
    }

    @keyframes fadeInLine4 {
      0%, 40%  { opacity: 0; }
      44%, 93% { opacity: 1; }
      98%, 100%{ opacity: 0; }
    }

    @keyframes fadeInLine5 {
      0%, 52%  { opacity: 0; }
      56%, 93% { opacity: 1; }
      98%, 100%{ opacity: 0; }
    }

    @keyframes meterGrow {
      0%, 54%   { width: 0px; }
      66%, 93%  { width: 175px; }
      98%, 100% { width: 0px; }
    }

    .cursor {
      animation: blinkCursor 1s infinite;
    }

    .line-step-1 { animation: fadeInLine1 11s infinite; }
    .line-step-2 { animation: fadeInLine2 11s infinite; }
    .line-step-3 { animation: fadeInLine3 11s infinite; }
    .line-step-4 { animation: fadeInLine4 11s infinite; }
    .line-step-5 { animation: fadeInLine5 11s infinite; }
    .meter-bar   { animation: meterGrow 11s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

    .code-font {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
    }
  </style>

  <!-- Terminal Window Shell -->
  <rect x="2" y="2" width="716" height="336" rx="14" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title Bar -->
  <rect x="2" y="2" width="716" height="38" rx="14" fill="url(#titleBarBg)" />
  <rect x="2" y="24" width="716" height="16" fill="url(#titleBarBg)" />
  <line x1="2" y1="40" x2="718" y2="40" stroke="#1E293B" stroke-width="1" />

  <!-- Window Controls (macOS Dots) -->
  <circle cx="24" cy="20" r="5.5" fill="#EF4444" />
  <circle cx="42" cy="20" r="5.5" fill="#F59E0B" />
  <circle cx="60" cy="20" r="5.5" fill="#10B981" />

  <!-- Window Title -->
  <text x="360" y="24" fill="#64748B" class="code-font" font-size="11.5" font-weight="500" text-anchor="middle">
    gustavo@system-core:~ (zsh)
  </text>

  <!-- LINE 0: Initial Command Prompt -->
  <text x="24" y="68" fill="#38BDF8" class="code-font" font-size="12.5" font-weight="700">gustavo@cloud</text>
  <text x="122" y="68" fill="#64748B" class="code-font" font-size="12.5">:</text>
  <text x="132" y="68" fill="#818CF8" class="code-font" font-size="12.5">~</text>
  <text x="144" y="68" fill="#F8FAFC" class="code-font" font-size="12.5">$</text>
  <text x="160" y="68" fill="#F1F5F9" class="code-font" font-size="12.5">npx @gustavo/specs --diagnostics</text>

  <!-- LINE 1: Profile -->
  <g class="line-step-1">
    <text x="24" y="98" fill="#34D399" class="code-font" font-size="12">✔</text>
    <text x="42" y="98" fill="#94A3B8" class="code-font" font-size="12">Perfil Ativo:</text>
    <text x="146" y="98" fill="#00D9FF" class="code-font" font-size="12" font-weight="600">Fullstack Architect &amp; AI Systems Engineer</text>
  </g>

  <!-- LINE 2: Stack -->
  <g class="line-step-2">
    <text x="24" y="126" fill="#34D399" class="code-font" font-size="12">✔</text>
    <text x="42" y="126" fill="#94A3B8" class="code-font" font-size="12">Stack Primária:</text>
    <text x="162" y="126" fill="#F8FAFC" class="code-font" font-size="12">Next.js 15, TypeScript, Supabase, Node.js, Tailwind</text>
  </g>

  <!-- LINE 3: AI & Agents -->
  <g class="line-step-3">
    <text x="24" y="154" fill="#34D399" class="code-font" font-size="12">✔</text>
    <text x="42" y="154" fill="#94A3B8" class="code-font" font-size="12">Agentes &amp; IA:</text>
    <text x="154" y="154" fill="#C084FC" class="code-font" font-size="12">Claude 3.7 Pipelines, OpenAI, n8n Multi-Channel</text>
  </g>

  <!-- LINE 4: Payments & Monetization -->
  <g class="line-step-4">
    <text x="24" y="182" fill="#34D399" class="code-font" font-size="12">✔</text>
    <text x="42" y="182" fill="#94A3B8" class="code-font" font-size="12">Monetização:</text>
    <text x="148" y="182" fill="#FBBF24" class="code-font" font-size="12">Stripe Billing, Webhooks, Assinaturas SaaS</text>
  </g>

  <!-- LINE 5: Metrics & Performance Panel -->
  <g class="line-step-5">
    <rect x="24" y="202" width="672" height="66" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    
    <!-- Metrics Row 1 -->
    <text x="40" y="224" fill="#94A3B8" class="code-font" font-size="11">SISTEMA STATUS:</text>
    <text x="150" y="224" fill="#10B981" class="code-font" font-size="11" font-weight="700">ONLINE (100%)</text>

    <text x="360" y="224" fill="#94A3B8" class="code-font" font-size="11">LATÊNCIA:</text>
    <text x="435" y="224" fill="#00D9FF" class="code-font" font-size="11" font-weight="700">~18ms (Edge CDN)</text>

    <!-- Metrics Row 2 (Progress Bar) -->
    <text x="40" y="251" fill="#64748B" class="code-font" font-size="10.5">PERFORMANCE</text>
    <rect x="140" y="242" width="180" height="11" rx="4" fill="#1E293B" />
    <rect x="140" y="242" width="175" height="11" rx="4" fill="url(#barFillCyan)" class="meter-bar" />
    <text x="330" y="251" fill="#00D9FF" class="code-font" font-size="10.5" font-weight="600">99.8% Core Web Vitals</text>
  </g>

  <!-- LINE 6: Active Bottom Prompt with Blinking Cursor -->
  <text x="24" y="302" fill="#38BDF8" class="code-font" font-size="12.5" font-weight="700">gustavo@cloud</text>
  <text x="122" y="302" fill="#64748B" class="code-font" font-size="12.5">:</text>
  <text x="132" y="302" fill="#818CF8" class="code-font" font-size="12.5">~</text>
  <text x="144" y="302" fill="#F8FAFC" class="code-font" font-size="12.5">$</text>
  <text x="160" y="302" fill="#E2E8F0" class="code-font" font-size="12.5">git commit -m "feat: shipping future-proof software"</text>
  <rect x="582" y="290" width="8" height="14" fill="#00D9FF" class="cursor" />
</svg>
