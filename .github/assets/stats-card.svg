<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 190" width="100%" height="100%" role="img" aria-labelledby="stats-title">
  <title id="stats-title">Métricas do GitHub: 2.504+ contribuições, 331 dias de sequência, 50+ projetos e 99,9% de disponibilidade</title>
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="838" height="188" rx="20" /></clipPath>

    <linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.11" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="gStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.36" />
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.16" />
    </linearGradient>
    <linearGradient id="gGlint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64D2FF" stop-opacity="0" />
      <stop offset="0.5" stop-color="#64D2FF" stop-opacity="1" />
      <stop offset="1" stop-color="#64D2FF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="orbBlue"><stop offset="0" stop-color="#0A84FF" stop-opacity="0.40" /><stop offset="1" stop-color="#0A84FF" stop-opacity="0" /></radialGradient>
    <radialGradient id="orbIndigo"><stop offset="0" stop-color="#5E5CE6" stop-opacity="0.38" /><stop offset="1" stop-color="#5E5CE6" stop-opacity="0" /></radialGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, Menlo, monospace; }

    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(90px, 20px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-100px, -20px); } }
    .o1 { animation: drift1 16s ease-in-out infinite alternate; }
    .o2 { animation: drift2 20s ease-in-out infinite alternate; }

    @keyframes glare { 0%, 55% { transform: translateX(0); } 100% { transform: translateX(1200px); } }
    .glare { animation: glare 11s ease-in-out infinite 3s; }

    @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(840px); } }
    .sweep { animation: sweep 8s ease-in-out infinite 1s; }

    @keyframes ring { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 0; transform: scale(2.8); } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rise { animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.45s; }
    .d4 { animation-delay: 0.6s; } .d5 { animation-delay: 0.75s; }

    @keyframes breathe { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    .breathe { animation: breathe 4s ease-in-out infinite; }
    .b2 { animation-delay: 0.6s; } .b3 { animation-delay: 1.2s; } .b4 { animation-delay: 1.8s; }

    @media (prefers-reduced-motion: reduce) {
      .o1, .o2, .glare, .sweep, .ring, .rise, .breathe { animation: none !important; }
      .ring, .sweep, .glare { opacity: 0; }
    }
  </style>

  <rect x="1" y="1" width="838" height="188" rx="20" fill="#06080F" />
  <g clip-path="url(#card)">
    <circle class="o1" cx="120" cy="190" r="230" fill="url(#orbIndigo)" />
    <circle class="o2" cx="700" cy="0" r="240" fill="url(#orbBlue)" />
    <g transform="skewX(-20)"><rect class="glare" x="-300" y="-20" width="140" height="240" fill="url(#gGlint)" opacity="0.09" /></g>
    <rect class="sweep" x="0" y="1" width="260" height="1.5" fill="url(#gSweep)" />
  </g>
  <rect x="1" y="1" width="838" height="188" rx="20" fill="none" stroke="url(#gStroke)" stroke-width="1" />

  <!-- Cabeçalho -->
  <text class="sans rise d1" x="40" y="42" fill="#F5F5F7" font-size="16" font-weight="600">Visão geral do GitHub</text>
  <g class="rise d1">
    <rect x="620" y="24" width="180" height="28" rx="14" fill="url(#gFill)" stroke="url(#gStroke)" stroke-width="1" />
    <circle class="ring" cx="638" cy="38" r="3.5" fill="#30D158" />
    <circle cx="638" cy="38" r="3.5" fill="#30D158" />
    <text class="sans" x="652" y="43" fill="#E5E7EB" font-size="12.5" font-weight="600">Atualizado diariamente</text>
  </g>

  <!-- Tiles -->
  <g class="rise d2" transform="translate(40, 66)">
    <rect width="181" height="106" rx="16" fill="url(#gFill)" stroke="url(#gStroke)" stroke-width="1" />
    <rect class="breathe" x="20" y="0.75" width="141" height="1" fill="url(#gGlint)" />
    <text class="mono" x="18" y="46" fill="#64D2FF" font-size="30" font-weight="700">2.504+</text>
    <text class="sans" x="18" y="70" fill="#F5F5F7" font-size="14" font-weight="600">Contribuições</text>
    <text class="sans" x="18" y="90" fill="#8B93A7" font-size="12.5">Commits e entregas</text>
  </g>
  <g class="rise d3" transform="translate(233, 66)">
    <rect width="181" height="106" rx="16" fill="url(#gFill)" stroke="url(#gStroke)" stroke-width="1" />
    <rect class="breathe b2" x="20" y="0.75" width="141" height="1" fill="url(#gGlint)" />
    <text class="mono" x="18" y="46" fill="#F5F5F7" font-size="30" font-weight="700">331 dias</text>
    <text class="sans" x="18" y="70" fill="#F5F5F7" font-size="14" font-weight="600">Sequência ativa</text>
    <text class="sans" x="18" y="90" fill="#8B93A7" font-size="12.5">Consistência diária</text>
  </g>
  <g class="rise d4" transform="translate(426, 66)">
    <rect width="181" height="106" rx="16" fill="url(#gFill)" stroke="url(#gStroke)" stroke-width="1" />
    <rect class="breathe b3" x="20" y="0.75" width="141" height="1" fill="url(#gGlint)" />
    <text class="mono" x="18" y="46" fill="#F5F5F7" font-size="30" font-weight="700">50+</text>
    <text class="sans" x="18" y="70" fill="#F5F5F7" font-size="14" font-weight="600">Projetos</text>
    <text class="sans" x="18" y="90" fill="#8B93A7" font-size="12.5">SaaS e agentes de IA</text>
  </g>
  <g class="rise d5" transform="translate(619, 66)">
    <rect width="181" height="106" rx="16" fill="url(#gFill)" stroke="url(#gStroke)" stroke-width="1" />
    <rect class="breathe b4" x="20" y="0.75" width="141" height="1" fill="url(#gGlint)" />
    <text class="mono" x="18" y="46" fill="#F5F5F7" font-size="30" font-weight="700">99,9%</text>
    <text class="sans" x="18" y="70" fill="#F5F5F7" font-size="14" font-weight="600">Disponibilidade</text>
    <text class="sans" x="18" y="90" fill="#8B93A7" font-size="12.5">Lighthouse 95+</text>
  </g>
</svg>
