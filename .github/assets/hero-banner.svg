<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="100%" height="100%" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Gustavo L Gonçalves, Fullstack Engineer especialista em SaaS e automação com IA</title>
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="838" height="298" rx="20" /></clipPath>

    <!-- Vidro: preenchimento, borda e brilho especular -->
    <linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.11" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="gStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.36" />
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.16" />
    </linearGradient>
    <linearGradient id="gGlint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64D2FF" />
      <stop offset="1" stop-color="#0A84FF" />
    </linearGradient>
    <linearGradient id="gSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64D2FF" stop-opacity="0" />
      <stop offset="0.5" stop-color="#64D2FF" stop-opacity="1" />
      <stop offset="1" stop-color="#64D2FF" stop-opacity="0" />
    </linearGradient>

    <!-- Orbes de cor atrás do vidro -->
    <radialGradient id="orbBlue"><stop offset="0" stop-color="#0A84FF" stop-opacity="0.50" /><stop offset="1" stop-color="#0A84FF" stop-opacity="0" /></radialGradient>
    <radialGradient id="orbIndigo"><stop offset="0" stop-color="#5E5CE6" stop-opacity="0.45" /><stop offset="1" stop-color="#5E5CE6" stop-opacity="0" /></radialGradient>
    <radialGradient id="orbCyan"><stop offset="0" stop-color="#64D2FF" stop-opacity="0.30" /><stop offset="1" stop-color="#64D2FF" stop-opacity="0" /></radialGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, Menlo, monospace; }

    @keyframes drift1 { from { transform: translate(0, 0); }       to { transform: translate(-70px, 50px); } }
    @keyframes drift2 { from { transform: translate(0, 0); }       to { transform: translate(80px, -40px); } }
    @keyframes drift3 { from { transform: translate(0, 0); }       to { transform: translate(-40px, -30px); } }
    .o1 { animation: drift1 14s ease-in-out infinite alternate; }
    .o2 { animation: drift2 18s ease-in-out infinite alternate; }
    .o3 { animation: drift3 11s ease-in-out infinite alternate; }

    /* Reflexo de vidro atravessa o card */
    @keyframes glare { 0%, 55% { transform: translateX(0); } 100% { transform: translateX(1200px); } }
    .glare { animation: glare 10s ease-in-out infinite; }

    /* Brilho percorre a borda superior */
    @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(840px); } }
    .sweep { animation: sweep 7s ease-in-out infinite; }

    @keyframes ring { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 0; transform: scale(2.8); } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }

    @keyframes role {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      29%  { opacity: 1; transform: translateY(0); }
      33%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    .role { opacity: 0; animation: role 12s ease-in-out infinite; }
    .role.r1 { opacity: 1; }
    .role.r2 { animation-delay: 4s; }
    .role.r3 { animation-delay: 8s; }

    @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: draw 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s backwards; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rise { animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.5s; }
    .d4 { animation-delay: 0.65s; } .d5 { animation-delay: 0.8s; }

    @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .breathe { animation: breathe 4s ease-in-out infinite; }
    .b2 { animation-delay: 0.6s; } .b3 { animation-delay: 1.2s; } .b4 { animation-delay: 1.8s; }

    @media (prefers-reduced-motion: reduce) {
      .o1, .o2, .o3, .glare, .sweep, .ring, .role, .bar, .rise, .breathe { animation: none !important; }
      .role.r2, .role.r3, .ring, .sweep, .glare { opacity: 0; }
    }
  </style>

  <!-- Base -->
  <rect x="1" y="1" width="838" height="298" rx="20" fill="#06080F" />
  <g clip-path="url(#card)">
    <circle class="o1" cx="720" cy="30" r="300" fill="url(#orbBlue)" />
    <circle class="o2" cx="90" cy="310" r="280" fill="url(#orbIndigo)" />
    <circle class="o3" cx="470" cy="140" r="170" fill="url(#orbCyan)" />
    <g transform="skewX(-20)"><rect class="glare" x="-300" y="-20" width="160" height="340" fill="url(#gGlint)" opacity="0.10" /></g>
    <rect class="sweep" x="0" y="1" width="260" height="1.5" fill="url(#gSweep)" />
  </g>
  <rect x="1" y="1" width="838" height="298" rx="20" fill="none" stroke="url(#gStroke)" stroke-width="1" />

  <!-- Status -->
  <g class="rise d1">
    <rect x="40" y="28" width="222" height="30" rx="15" fill="url(#gFill)" stroke="url(#gStroke)" stroke-width="1" />
    <circle class="ring" cx="58" cy="43" r="4" fill="#30D158" />
    <circle cx="58" cy="43" r="4" fill="#30D158" />
    <text class="sans" x="74" y="48" fill="#E5E7EB" font-size="13.5" font-weight="600">Disponível para projetos</text>
  </g>
  <text class="mono rise d1" x="800" y="48" fill="#A1A8B8" font-size="13" text-anchor="end">Florianópolis, SC</text>

  <!-- Nome -->
  <text class="sans rise d2" x="40" y="112" fill="#F5F5F7" font-size="46" font-weight="700" letter-spacing="-1.2">Gustavo L Gonçalves</text>
  <rect class="bar" x="40" y="126" width="56" height="3" rx="1.5" fill="url(#gAccent)" />

  <!-- Frase rotativa -->
  <g class="sans" font-size="21" font-weight="500" fill="#D1D5DB">
    <text class="role r1" x="40" y="162">Fullstack Engineer · Especialista em SaaS</text>
    <text class="role r2" x="40" y="162">Agentes e automação com IA</text>
    <text class="role r3" x="40" y="162">Next.js · TypeScript · Cloud &amp; APIs</text>
  </g>

  <text class="sans rise d3" x="40" y="190" fill="#A1A8B8" font-size="15">Transformo conceitos complexos em produtos digitais escaláveis, rápidos e lucrativos.</text>

  <!-- Métricas em vidro -->
  <g class="rise d2" transform="translate(40, 214)">
    <rect width="181" height="62" rx="14" fill="url(#gFill)" stroke="url(#gStroke)" stroke-width="1" />
    <rect class="breathe" x="18" y="0.75" width="145" height="1" fill="url(#gGlint)" />
    <text class="mono" x="16" y="28" fill="#F5F5F7" font-size="21" font-weight="700">50+</text>
    <text class="sans" x="16" y="49" fill="#A1A8B8" font-size="13">Projetos entregues</text>
  </g>
  <g class="rise d3" transform="translate(233, 214)">
    <rect width="181" height="62" rx="14" fill="url(#gFill)" stroke="url(#gStroke)" stroke-width="1" />
    <rect class="breathe b2" x="18" y="0.75" width="145" height="1" fill="url(#gGlint)" />
    <text class="mono" x="16" y="28" fill="#F5F5F7" font-size="21" font-weight="700">95+</text>
    <text class="sans" x="16" y="49" fill="#A1A8B8" font-size="13">Lighthouse score</text>
  </g>
  <g class="rise d4" transform="translate(426, 214)">
    <rect width="181" height="62" rx="14" fill="url(#gFill)" stroke="url(#gStroke)" stroke-width="1" />
    <rect class="breathe b3" x="18" y="0.75" width="145" height="1" fill="url(#gGlint)" />
    <text class="mono" x="16" y="28" fill="#F5F5F7" font-size="21" font-weight="700">99,9%</text>
    <text class="sans" x="16" y="49" fill="#A1A8B8" font-size="13">Disponibilidade</text>
  </g>
  <g class="rise d5" transform="translate(619, 214)">
    <rect width="181" height="62" rx="14" fill="url(#gFill)" stroke="url(#gStroke)" stroke-width="1" />
    <rect class="breathe b4" x="18" y="0.75" width="145" height="1" fill="url(#gGlint)" />
    <text class="mono" x="16" y="28" fill="#64D2FF" font-size="21" font-weight="700">AI-first</text>
    <text class="sans" x="16" y="49" fill="#A1A8B8" font-size="13">Agentes &amp; IA</text>
  </g>
</svg>
